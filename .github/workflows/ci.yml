name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements-dev.txt
      - name: Lint
        run: ruff check pipeline
      - name: Tests
        run: python -m pytest -q
        working-directory: pipeline

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Type-check & build
        run: npm run build
        working-directory: web
      # A build can succeed and still ship unstyled pages (the Tailwind 4 bump
      # did exactly that). Fail if theme utilities the page relies on are gone.
      - name: Check built CSS has theme utilities
        working-directory: web
        run: |
          css=$(cat dist/assets/*.css)
          missing=0
          for cls in px-4 text-sm max-w-6xl rounded-2xl font-sans text-slate-200 bg-panel; do
            if ! grep -q "\.$cls[^-a-zA-Z0-9]" <<<"$css"; then
              echo "::error::built CSS is missing .$cls"
              missing=1
            fi
          done
          exit $missing
